  .hill { position:absolute; left:-10%;right:-10%;bottom:-95px;height:180px;border-radius:50% 50% 0 0;background:#263f4c; }

  .dog-wrap { position:relative; z-index:2; width:220px;height:230px; display:flex;align-items:flex-end;justify-content:center; transform-origin:bottom center; }
  .dog-wrap { visibility:hidden; }

  .dog-gif { width:100%;height:100%;object-fit:contain;display:none; filter:drop-shadow(0 12px 10px #0005); }
  .dog-emoji { font-size:clamp(6rem, 20vw, 10rem); line-height:1; filter:drop-shadow(0 12px 8px #0005); transform:scaleX(-1); }
  .dog-wrap.running { animation:runIn 2.3s cubic-bezier(.2,.8,.2,1) both; }

  .dog-wrap.stopped { animation:stopWiggle .6s ease-out; }
  @keyframes runIn { from { transform:translateX(-48vw) scale(.25); opacity:.2; } 72% { transform:translateX(12px) scale(1.05);opacity:1; } to { transform:translateX(0) scale(1);opacity:1; } }
  @keyframes bound { from { transform:translateY(0) scaleX(-1); } to { transform:translateY(-12px) scaleX(-1); } }
  @keyframes stopWiggle { 0%{transform:rotate(-8deg)} 35%{transform:rotate(7deg)} 70%{transform:rotate(-3deg)} 100%{transform:rotate(0)} }
  .speech { position:absolute;top:22px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:10px 16px;border-radius:18px;background:#fff7f0;color:#302943;font-weight:800;box-shadow:0 8px 25px #0003;opacity:0;transition:opacity .4s; }
  .speech:after { content:"";position:absolute;left:50%;bottom:-9px;border-width:10px 9px 0;border-style:solid;border-color:#fff7f0 transparent transparent; }
  .speech.show { opacity:1; }
  .paw { position:absolute;font-size:1.5rem;opacity:0;animation:pawFade 1.8s ease-out forwards; }
  @keyframes pawFade { 0%{opacity:0;transform:translateY(10px) rotate(-20deg)} 25%{opacity:.7} 100%{opacity:0;transform:translateY(-35px) rotate(20deg)} }
  .controls { text-align:center; padding:20px 0 8px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:999px; padding:14px 24px; font-weight:800; transition:transform .2s, box-shadow .2s, opacity .2s; }
  button:hover { transform:translateY(-2px); }
  .primary { color:#48253d; background:linear-gradient(135deg,#ffc0d8,#fff0f5); box-shadow:0 0 28px #ff8db855; }
  .secondary { color:#fce8f1;background:#ffffff12;border:1px solid #ffffff3b; }
  button:disabled { opacity:.55;cursor:wait;transform:none; }
  .hidden { display:none !important; }
  .hint { color:#c9c7e5;font-size:.9rem;margin-top:10px; }
  .letter { margin:28px auto 0; max-width:760px; background:var(--cream); color:var(--ink); border-radius:24px; padding:clamp(20px,5vw,42px); box-shadow:0 25px 70px #0004; transform:translateY(16px);opacity:0;transition:opacity .8s,transform .8s; }
  .letter.show { opacity:1;transform:translateY(0); }
  .letter h2 { margin:0 0 16px;text-align:center;font-size:clamp(1.6rem,4vw,2.2rem); }
  .photo-frame { width:min(100%,430px);margin:0 auto 22px;padding:10px 10px 18px;background:white;box-shadow:0 5px 20px #30294318;transform:rotate(-1deg); }
  .photo-frame img { width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f0e7ef; }
  .photo-caption { text-align:center;color:#7b6885;margin-top:10px;font-size:.9rem; }
  .gallery-title { text-align:center;margin:34px 0 6px;font-size:clamp(1.35rem,3.5vw,1.8rem); }

  .photo-tile { display:block;position:relative;width:100%;break-inside:avoid;margin:0 0 14px;padding:8px 8px 12px;border-radius:3px;background:#fff;color:#786781;box-shadow:0 7px 20px #30294318;text-align:left;white-space:normal; }

  .photo-tile img { display:block;width:100%;height:auto;min-height:125px;max-height:420px;object-fit:cover;background:#f4edf5;color:#786a80;font-size:.85rem; }
  .photo-tile span { display:block;text-align:center;font-size:.88rem;margin-top:9px; }
  .photo-tile:hover { z-index:2;box-shadow:0 12px 30px #3029432b; }
  .lightbox { position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:54px 58px 42px;background:#080a18ed;backdrop-filter:blur(10px); }
  .lightbox.open { display:flex; }
  .lightbox-figure { margin:0;max-width:min(100%,1000px);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px; }
  .lightbox-figure img { display:block;max-width:100%;max-height:calc(100vh - 135px);width:auto;height:auto;object-fit:contain;border:7px solid #fff;border-bottom-width:18px;box-shadow:0 18px 65px #0008; }
  .lightbox-figure figcaption { color:#fff0f7;text-align:center; }
  .lightbox-close,.lightbox-nav { position:absolute;background:#ffffff20;color:white;border:1px solid #ffffff45;border-radius:50%;padding:0;display:grid;place-items:center; }
  .lightbox-close { right:18px;top:16px;width:42px;height:42px;font-size:1.2rem; }
  .lightbox-nav { top:50%;transform:translateY(-50%);width:44px;height:54px;font-size:2rem;line-height:1; }
  .lightbox-nav:hover { transform:translateY(-50%) scale(1.05); }
  .lightbox-nav.prev { left:12px; }
  .lightbox-nav.next { right:12px; }
  .lightbox-count { position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#c9c7e5;font-size:.85rem; }
  .message { white-space:pre-line;line-height:2;font-size:1.05rem;min-height:100px; }
  .final-reveal-wrap { text-align:center; margin:24px auto 10px; }
  .final-reveal-btn { padding:14px 25px; border-radius:999px; border:0; cursor:pointer; background:linear-gradient(135deg,#ff80b3,#ec5b94); color:white; font-size:1rem; font-weight:800; box-shadow:0 8px 24px #e65d9350; transition:transform .2s,box-shadow .2s; }
  .final-reveal-btn:hover { transform:translateY(-2px); box-shadow:0 12px 26px #e65d9360; }
  .final-reveal-btn:disabled { opacity:.75; cursor:default; }
  .final-line { text-align:center;color:#e65d93;font-size:clamp(1.25rem,4vw,1.8rem);font-weight:900;margin-top:20px;white-space: pre-line; }
  .signature { text-align:right;color:#887b94;margin-top:20px; }
  .footer { text-align:center;color:#bdbada;font-size:.82rem;margin-top:30px;line-height:1.8; }

</style>
<style id="realistic-beach-override">
/* 以實拍海灘取代原本的 CSS 插畫，保留哈士奇與相簿互動 */
.scene .sea-surface,.scene .beach,.scene .wave,.scene .hill,.scene .runway {display:none!important;}
.scene .people {bottom:13%;right:12%;opacity:.55;transform:scale(.8);transform-origin:bottom right;}
.scene {background-position:center 65%;}
body {background-attachment:fixed;}
@media(max-width:600px){body{background-position:63% center;background-attachment:scroll}.scene{background-position:65% center}}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div>
<main>
  <div class="topline">SUNSET · SEA · A LITTLE SURPRISE ✦</div>
  <h1>欸，先不要滑走！</h1>
  <p class="subtitle">我有派出一位重要代表，來傳達一件很重要的事……<br>牠可能有點失控，請多包涵。</p>

  <section class="scene" id="scene" aria-label="哈士奇登場動畫">
    <div class="speech" id="speech">報告！我把可愛帶來了！🐾</div>
    <div class="sea-surface"></div><div class="beach"></div><div class="wave one"></div><div class="wave two"></div><div class="people" aria-hidden="true"><span class="person"></span><span class="person small"></span><span class="person"></span></div><div class="runway"></div>
    <div class="dog-wrap" id="dogWrap">
      <!-- 【二哈 GIF 替換位置】把 husky.gif 放在本 HTML 同一個資料夾即可。
           建議使用透明背景、正在奔跑、循環播放的 GIF。若檔案不存在會自動改用下方 emoji。 -->
      <img class="dog-gif" id="dogGif" src="husky.gif" alt="跑過來的哈士奇">
      <div class="dog-emoji" id="dogEmoji" aria-hidden="true">🐺</div>
    </div>
  </section>

  <div class="controls">
    <button class="primary" id="startBtn">🐾 召喚二哈！</button>
    <button class="primary hidden" id="confessBtn">💌 好啦，點我看正事</button>
    <p class="hint" id="hint">按下按鈕，看看牠到底要幹嘛。</p>
  </div>

  <section class="letter" id="letter">
    <h2>給最特別的妳 💗</h2>
    <div class="photo-frame">
      <!-- 【封面照片替換位置】把主照片命名為 our-photo.jpg，放在同一資料夾。 -->
      <img id="ourPhoto" src="our-photo.jpg" alt="我們的照片">
      <div class="photo-caption">♡</div>
    </div>

    <!-- 【照片瀑布流相簿】可自由新增/刪除 photo-tile。
         把圖片檔放在同一資料夾，修改 src 與 alt；點照片可放大瀏覽。 -->
    <h3 class="gallery-title">我們的小小回憶相簿 📸</h3>
    <p class="gallery-intro">點開每一張照片，再一起回到那個瞬間。</p>
    <div class="photo-waterfall" id="photoWaterfall">
      <button class="photo-tile" type="button" data-full="memory-1.jpg" aria-label="放大回憶照片 1">
        <img src="memory-1.jpg" alt="回憶照片 1" loading="lazy"><span>那天的快樂 ♡</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-2.jpg" aria-label="放大回憶照片 2">
        <img src="memory-2.jpg" alt="回憶照片 2" loading="lazy"><span>和妳在一起的日常</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-3.jpg" aria-label="放大回憶照片 3">
        <img src="memory-3.jpg" alt="回憶照片 3" loading="lazy"><span>不小心就笑得很開心</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-4.jpg" aria-label="放大回憶照片 4">
        <img src="memory-4.jpg" alt="回憶照片 4" loading="lazy"><span>想再一起創造各種回憶</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-5.jpg" aria-label="放大回憶照片 5">
        <img src="memory-5.jpg" alt="回憶照片 5" loading="lazy"><span>平凡但很珍貴</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-6.jpg" aria-label="放大回憶照片 6">
        <img src="memory-6.jpg" alt="回憶照片 6" loading="lazy"><span>以後還想收集更多</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-7.jpg" aria-label="放大回憶照片 7">
        <img src="memory-7.jpg" alt="回憶照片 7" loading="lazy"><span>偷偷珍藏的瞬間</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-8.jpg" aria-label="放大回憶照片 8">
        <img src="memory-8.jpg" alt="回憶照片 8" loading="lazy"><span>還想和妳去更多地方</span>
      </button>
      <button class="photo-tile" type="button" data-full="memory-9.jpg" aria-label="放大回憶照片 9">
        <img src="memory-9.jpg" alt="回憶照片 9" loading="lazy"><span>這張也很喜歡 ♡</span>
      </button>
    </div>

    <!-- 點擊照片後顯示的放大檢視視窗 -->
    <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="照片放大檢視">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="關閉照片">✕</button>
      <button class="lightbox-nav prev" id="photoPrev" type="button" aria-label="上一張照片">‹</button>
      <figure class="lightbox-figure">
        <img id="lightboxImage" src="" alt="">
        <figcaption id="lightboxCaption"></figcaption>
      </figure>
      <button class="lightbox-nav next" id="photoNext" type="button" aria-label="下一張照片">›</button>
      <div class="lightbox-count" id="lightboxCount"></div>
    </div>

    <!-- 【告白文字替換位置】請修改 confessionText 變數中的內容。 -->
    <div class="message" id="message"></div>
    <!-- 【新增】前面的告白文字打完，才會出現這顆按鈕 -->
    <div class="final-reveal-wrap"><button type="button" id="finalRevealBtn" class="final-reveal-btn hidden">💗 還有最後一件事想告訴妳…</button></div>
    <div class="final-line" id="finalLine" aria-live="polite"></div>
    <div class="signature">—— 你的二哈</div>
  </section>

  <div class="footer"><br></div>
</main>
<script>
  // 裝飾星星
  const stars = document.getElementById('stars');
  for (let i = 0; i < 65; i++) {
    const star = document.createElement('i');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = (Math.random() * 3) + 's';
    star.style.animationDuration = (1.5 + Math.random() * 3) + 's';
    stars.appendChild(star);
  }

  // GIF 沒有成功載入時，顯示可愛的 emoji 替代畫面
  const dogGif = document.getElementById('dogGif');
  const dogEmoji = document.getElementById('dogEmoji');
  dogGif.addEventListener('load', () => {
    if (dogGif.naturalWidth > 0) {
      dogGif.style.display = 'block';
      dogEmoji.style.display = 'none';
    }
  });
  dogGif.addEventListener('error', () => {
    dogGif.style.display = 'none';
    dogEmoji.style.display = 'block';
  });

  const dogWrap = document.getElementById('dogWrap');
  const speech = document.getElementById('speech');
  const startBtn = document.getElementById('startBtn');
  const confessBtn = document.getElementById('confessBtn');
  const hint = document.getElementById('hint');
  const letter = document.getElementById('letter');
  const message = document.getElementById('message');
  const finalLine = document.getElementById('finalLine');

  // 【告白文字替換位置 1】把這段改成你想親口對她說的內容。
  const confessionText = `沛㬢，有些話，雖然已經說過了，但還是想要再讓妳知道。
每次跟妳聊天、一起出去，或只是看到妳分享日常，都會讓我的一天變得更好。
下班的時候只要知道妳在等我，我就會克制不住地往妳那裡飛奔。
我很喜歡跟妳相處時那種自在又開心的感覺，希望妳在跟我相處時也有相同的感覺。
我也希望自己能夠成為和妳一起分享生活，在妳心情不好的時候接住妳的那個人。
我不想只把這份心意藏在心裡，所以決定認真告訴妳。`;

  // 【告白文字替換位置 2】最後想強調的那句話。
  const finalText = `我愛妳，妳願意給我機會，讓我陪妳走未來的路。 
	
妳願意當我的女朋友嗎？♡`;

  function addPaws() {
    const scene = document.getElementById('scene');
    for (let i = 0; i < 7; i++) {
      setTimeout(() => {
        const paw = document.createElement('span');
        paw.className = 'paw';
        paw.textContent = '🐾';
        paw.style.left = (12 + Math.random() * 76) + '%';
        paw.style.bottom = (22 + Math.random() * 35) + '%';
        scene.appendChild(paw);
        setTimeout(() => paw.remove(), 1900);
      }, i * 180);
    }
  }

  startBtn.addEventListener('click', () => {
    startBtn.disabled = true;
    startBtn.textContent = '🏃 二哈全速前進中……';
    hint.textContent = '';
    dogWrap.classList.add('revealed');
    dogWrap.classList.remove('stopped', 'running');
    void dogWrap.offsetWidth;
    dogWrap.classList.add('running');
    addPaws();
    setTimeout(() => {
      dogWrap.classList.remove('running');
      dogWrap.classList.add('stopped');
      speech.classList.add('show');
      startBtn.classList.add('hidden');
      confessBtn.classList.remove('hidden');
      hint.textContent = '';
    }, 2450);
  });

  function typeText(element, text, speed, done) {
    let index = 0;
    element.textContent = '';
    function step() {
      if (index < text.length) {
        element.textContent += text[index++];
        setTimeout(step, speed);
      } else if (done) done();
    }
    step();
  }

  const finalRevealBtn = document.getElementById('finalRevealBtn');
  finalRevealBtn.addEventListener('click', () => {
    finalRevealBtn.disabled = true;
    finalRevealBtn.classList.add('hidden');
    typeText(finalLine, finalText, 85, () => {
      finalLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  confessBtn.addEventListener('click', () => {
    confessBtn.disabled = true;
    confessBtn.textContent = '💗 正在把真心送達……';
    letter.classList.add('show');
    setTimeout(() => letter.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    typeText(message, confessionText, 48, () => {
      confessBtn.textContent = '💗 心裡話已送達';
      finalRevealBtn.classList.remove('hidden');
      setTimeout(() => finalRevealBtn.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
    });
  });

  // 瀑布流照片放大檢視：支援上一張/下一張、Esc 與左右方向鍵。
  const photoTiles = Array.from(document.querySelectorAll('.photo-tile'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImage = document.getElementById('lightboxImage');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxCount = document.getElementById('lightboxCount');
  let currentPhotoIndex = 0;
  function showLightbox(index) {
    currentPhotoIndex = (index + photoTiles.length) % photoTiles.length;
    const tile = photoTiles[currentPhotoIndex];
    const img = tile.querySelector('img');
    lightboxImage.src = tile.dataset.full;
    lightboxImage.alt = img.alt;
    lightboxCaption.textContent = tile.querySelector('span').textContent;
    lightboxCount.textContent = `${currentPhotoIndex + 1} / ${photoTiles.length}`;
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lightboxImage.src = '';
  }
  photoTiles.forEach((tile, index) => tile.addEventListener('click', () => showLightbox(index)));
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('photoPrev').addEventListener('click', () => showLightbox(currentPhotoIndex - 1));
  document.getElementById('photoNext').addEventListener('click', () => showLightbox(currentPhotoIndex + 1));
  lightbox.addEventListener('click', (event) => { if (event.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (event) => {
    if (!lightbox.classList.contains('open')) return;
    if (event.key === 'Escape') closeLightbox();
    if (event.key === 'ArrowLeft') showLightbox(currentPhotoIndex - 1);
    if (event.key === 'ArrowRight') showLightbox(currentPhotoIndex + 1);
  });

  // 如果照片檔不存在，使用中性的提示圖，避免出現破圖圖示。
  document.getElementById('ourPhoto').addEventListener('error', function() {
    this.removeAttribute('src');
    this.alt = '請把你們的照片命名為 our-photo.jpg，放在 confession.html 同一資料夾';
    this.style.display = 'none';
    const caption = this.nextElementSibling;
    caption.textContent = '📷 把你們的照片命名為 our-photo.jpg，放在同一資料夾，就會顯示在這裡。';
  });
  document.querySelectorAll('.photo-card img').forEach((img) => {
    img.addEventListener('error', function() {
      this.removeAttribute('src');
      this.alt = '請放入對應的回憶照片';
      this.style.objectFit = 'contain';
      this.style.padding = '18px';
      this.style.minHeight = '120px';
      this.style.background = '#f4edf5';
      this.style.display = 'block';
      this.style.fontSize = '.85rem';
      this.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#f4edf5"/><text x="50%" y="46%" text-anchor="middle" font-size="42">📷</text><text x="50%" y="65%" text-anchor="middle" font-size="17" fill="#786a80">替換成你的照片</text></svg>'
      );
    }, { once: true });
  });
</script>
</body>
</html>
